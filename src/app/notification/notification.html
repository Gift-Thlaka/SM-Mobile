<main>

    <errorBar [errorText]="errorText()"></errorBar>

    <section>

        @for (notifi of notificationList(); track notifi.id) {
        
            <div class="item">
                <strong>{{notifi.name}}</strong>
                <p>{{notifi.instruction}}</p>
                <button type="button" (click)="updated(notifi.id)">Updated</button>
            </div>
        }

    </section>

</main>
